aid: doorloop

name: DoorLoop

description: DoorLoop is property management software with a REST API for managing properties, units, leases, rent collection, maintenance requests,
  accounting, and tenant communication. The API provides two-way access to read and write data across nearly every DoorLoop feature, with predictable
  resource-oriented URLs, JSON-encoded request and response bodies, and standard HTTP response codes. API access is included on the Premium plan.

