openapi: 3.2.0
info:
  title: DoorLoop API Reference Properties API
  version: '1.0'
  summary: This is the DoorLoop API
  description: It does some pretty cool stuff and gives you complete access to DoorLoop's data
  license:
    name: Terms and Conditions
    url: https://www.doorloop.com/legal/terms
  contact:
    name: DoorLoop Inc.
    url: www.doorloop.com
    email: support@doorloop.com
  termsOfService: https://www.doorloop.com/legal/terms
servers:
- url: https://app.doorloop.com/api
  description: Production
tags:
- name: Properties
paths:
  /properties:
    parameters: []
    get:
      summary: List all Properties
      responses:
        '200':
          description: Accounts Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: number
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/property'
              examples: {}
            application/xml:
              schema:
                type: object
                properties: {}
            multipart/form-data:
              schema:
                type: object
                properties: {}
        '400':
          description: Bad Request
      operationId: get-properties
      description: Lists all Properties
      parameters:
      - schema:
          type: string
        in: query
        name: filter_text
        description: Filter by Property Name
      - schema:
          type: string
        in: query
        name: filter_group
        description: Filter by Portfolio Id
      - schema:
          type: string
          enum:
          - RESIDENTIAL
          - COMMERCIAL
        in: query
        name: filter_class
        description: Filter by Property Class
      - schema:
          type: string
        in: query
        name: filter_owner
        description: Filter by Property Owner
      tags:
      - Properties
      security:
      - Key: []
  /properties/{propertyId}:
    parameters:
    - schema:
        type: string
      name: propertyId
      in: path
      required: true
      description: The Property Id
    get:
      summary: Retrieve a Property
      tags:
      - Properties
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/property'
        '404':
          description: Not Found
      operationId: get-property
      description: Retrieves a Property
      security:
      - Key: []
components:
  schemas:
    mongoId:
      type: string
      title: mongoId
      x-stoplight:
        id: 40j7qlmpihfdj
      pattern: /^[a-f\d]{24}$/i
      examples:
      - 507f191e810c19729de860ea
      example: 00000020f51bb4362eee2a4d
    property:
      title: property
      x-stoplight:
        id: i1ymxdkpfcody
      type: object
      properties:
        id:
          $ref: '#/components/schemas/mongoId'
        name:
          type: string
          maxLength: 255
        type:
          $ref: '#/components/schemas/propertyType'
        address:
          $ref: '#/components/schemas/address'
        description:
          type: string
        class:
          type: string
          description: Read Only
          enum:
          - RESIDENTIAL
          - COMMERCIAL
        active:
          type: boolean
          readOnly: true
          description: Whether the property is active. A property cannot be made inactive while it has active units, and a unit cannot be made active while its property is inactive.
        numActiveUnits:
          type: number
          readOnly: true
          description: The number of units in this property with active set to true, whether or not they are listed.
        settings:
          type: object
          description: Per-property settings. settings.defaultAccounts.bank_operating is the operating account for this property and is the correct value to use as depositToAccount when recording a payment. A portfolio can run a different bank account per property, so do not resolve one account per company and reuse it; the company-level default is only the fallback. The groups that can appear, once they have been set, are tenantPortal, lateFeesPolicy, rentersInsurance, paymentAllocations, recurringTransactions, defaultAccounts, propertyReserve, managementFees, mailingTemplates, paymentInstructions, convenienceFeesPolicy, creditCardConvenienceFeesPolicy, returnedPaymentFeesSettings, rentReminders, tenantRequests and showings.
          properties:
            defaultAccounts:
              type: object
              properties:
                bank_operating:
                  $ref: '#/components/schemas/mongoId'
        owners:
          type: array
          items:
            type: object
            properties:
              owner:
                $ref: '#/components/schemas/mongoId'
              ownershipPercentage:
                type: number
                minimum: 0
                maximum: 100
            required:
            - owner
            - ownershipPercentage
        pictures:
          type: array
          items:
            $ref: '#/components/schemas/picture'
        amenities:
          type: array
          description: Please refer to the MITS standard documentation for a list of possible values
          items:
            type: string
      required:
      - name
      - type
      - address
    propertyType:
      type: string
      title: propertyType
      x-stoplight:
        id: rjlkdgrtkg7wn
      enum:
      - RESIDENTIAL_SINGLE_FAMILY
      - RESIDENTIAL_MULTI_FAMILY
      - RESIDENTIAL_CONDO
      - RESIDENTIAL_TOWNHOME
      - RESIDENTIAL_OTHER
      - COMMERCIAL_OTHER
      - COMMERCIAL_INDUSTRIAL
      - COMMERCIAL_OFFICE
      - COMMERCIAL_RETAIL
      - COMMERCIAL_SHOPPING_CENTER
      - COMMERCIAL_STORAGE
      - COMMERCIAL_PARKING
      - COMMERCIAL_CO_WORKING
    picture:
      title: picture
      x-stoplight:
        id: pep1xv4l41v6m
      type: object
      properties:
        rank:
          type: integer
          description: Represents the index of this picture in ascending order
        url:
          type: string
          description: The URL of the picture
    address:
      title: address
      x-stoplight:
        id: a6vhbqoeituyk
      type: object
      description: ''
      properties:
        street1:
          type: string
        street2:
          type: string
        city:
          type: string
        zip:
          type: string
        country:
          type: string
        lat:
          type: string
        lng:
          type: string
  securitySchemes:
    Key:
      type: apiKey
      in: header
      name: Authorization
      description: 'Bearer token. Create a key under Settings -> API access; it is a JWT. Example: `Authorization: Bearer eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.<payload>.<signature>`'
