openapi: 3.2.0
info:
  title: DoorLoop API Reference Tasks API
  version: '1.0'
  summary: This is the DoorLoop API
  description: It does some pretty cool stuff and gives you complete access to DoorLoop's data
  license:
    name: Terms and Conditions
    url: https://www.doorloop.com/legal/terms
  contact:
    name: DoorLoop Inc.
    url: www.doorloop.com
    email: support@doorloop.com
  termsOfService: https://www.doorloop.com/legal/terms
servers:
- url: https://app.doorloop.com/api
  description: Production
tags:
- name: Tasks
paths:
  /tasks:
    parameters: []
    get:
      summary: Retrieve all Tasks
      tags:
      - Tasks
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/task'
      operationId: get-tasks
      description: Retrieves all Tasks
      security:
      - Key: []
      parameters:
      - schema:
          type: string
        in: query
        name: filter_propertyGroup
        description: Filter by Portfolio Id
      - schema:
          type: string
        in: query
        name: filter_property
        description: Filter by Property Id
      - schema:
          type: string
        in: query
        name: filter_unit
        description: Filter by Unit Id
      - schema:
          type: string
          enum:
          - INTERNAL_TASK
          - WORK_ORDER
          - TENANT_REQUEST
          - OWNER_REQUEST
        in: query
        name: filter_type
        description: Filter by Task Type
      - schema:
          type: string
          enum:
          - NOT_STARTED
          - IN_PROGRESS
          - COMPLETED
          - NOT_COMPLETED
          - RECEIVED
          - ARCHIVED
        in: query
        name: filter_status
        description: Filter by Task Status
      - schema:
          type: string
        in: query
        name: filter_createdAt_from
        description: 'Format: YYYY-MM-DD'
      - schema:
          type: string
        in: query
        name: filter_createdAt_to
        description: 'Format: YYYY-MM-DD'
      - schema:
          type: string
        in: query
        name: filter_dueDate_from
        description: 'Format: YYYY-MM-DD'
      - schema:
          type: string
        in: query
        name: filter_dueDate_to
        description: 'Format: YYYY-MM-DD'
      - schema:
          type: string
        in: query
        name: filter_completedAt_from
        description: 'Format: YYYY-MM-DD'
      - schema:
          type: string
        in: query
        name: filter_completedAt_to
        description: 'Format: YYYY-MM-DD'
      - schema:
          type: string
        in: query
        name: filter_assignedToUser
        description: Filter by User Id or "unassigned"
      - schema:
          type: string
        in: query
        name: filter_text
        description: Filter by Subject, Description or Reference
      - schema:
          type: string
        in: query
        name: filter_requestedById
        description: Filter by Requested by User, Tenant or Owner Id
    post:
      summary: Create a Task
      operationId: post-task
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/task'
        '400':
          description: Bad Request
      description: Creates a Task
      security:
      - Key: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/task'
      tags:
      - Tasks
  /tasks/update:
    parameters: []
    post:
      summary: Post an Update on a Task
      operationId: post-task-update
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/task'
        '400':
          description: Bad Request
      description: Posts an update on a task
      security:
      - Key: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                taskId:
                  $ref: '#/components/schemas/mongoId'
                message:
                  type: string
                  description: '10000'
                dueDate:
                  type: string
                  description: 'Format: YYYY-MM-DD'
                priority:
                  type: string
                  enum:
                  - LOW
                  - MEDIUM
                  - HIGH
                status:
                  type: string
                  enum:
                  - NOT_STARTED
                  - RECEIVED
                  - IN_PROGRESS
                  - COMPLETED
                  - ARCHIVED
                assignedToUsers:
                  type: array
                  items:
                    $ref: '#/components/schemas/mongoId'
                notifyTenant:
                  type: boolean
                notifyAssignees:
                  type: boolean
              required:
              - taskId
      tags:
      - Tasks
  /tasks/{taskId}:
    parameters:
    - schema:
        type: string
      name: taskId
      in: path
      required: true
    get:
      summary: Retrieve a Task
      tags:
      - Tasks
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/task'
        '404':
          description: Not Found
      operationId: get-task
      description: Retrieves a Task
      security:
      - Key: []
    put:
      summary: Update a Task
      operationId: put-task
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/task'
        '400':
          description: Bad Request
        '404':
          description: Not Found
      tags:
      - Tasks
      description: Updates a Task
      security:
      - Key: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/task'
    delete:
      summary: Deletes a Task
      operationId: delete-task
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/task'
        '400':
          description: Bad Request
        '404':
          description: Not Found
      security:
      - Key: []
      tags:
      - Tasks
components:
  schemas:
    task:
      title: task
      x-stoplight:
        id: p0f9c0fwm79sl
      allOf:
      - properties:
          id:
            $ref: '#/components/schemas/mongoId'
          type:
            type: string
            enum:
            - INTERNAL_TASK
            - TENANT_REQUEST
            - OWNER_REQUEST
            - WORK_ORDER
          reference:
            type: string
          subject:
            type: string
            maxLength: 255
          description:
            type: string
            maxLength: 10000
          dueDate:
            type: string
            description: 'Format: YYYY-MM-DD'
          status:
            type: string
            enum:
            - NOT_STARTED
            - RECEIVED
            - IN_PROGRESS
            - COMPLETED
            - ARCHIVED
          priority:
            type: string
            enum:
            - LOW
            - MEDIUM
            - HIGH
          requestedByUser:
            type: string
            description: "The User Id who requested this task. \nRequired if type == INTERNAL_TASK."
          requestedByTenant:
            type: string
            description: "The Tenant Id who requested this task. \nRequired if type == TENANT_REQUEST."
          requestedByOwner:
            type: string
            description: "The Owner Id who requested this task. \nRequired if type == OWNER_REQUEST."
          assignedToUsers:
            type: array
            items:
              $ref: '#/components/schemas/mongoId'
          property:
            $ref: '#/components/schemas/mongoId'
          unit:
            $ref: '#/components/schemas/mongoId'
          notifyTenant:
            type: boolean
            description: If type = TENANT_REQUEST and notifyTenant = "true" the tenants will be notified when this task is created or updated.
          notifyAssignees:
            type: boolean
            description: If set to "true", the assigned to users will be notified when this task is created or updated.
          entryNotes:
            type: string
            maxLength: 10000
          workOrder:
            type: object
            description: Required if type == WORK_ORDER
            properties:
              assignedToVendor:
                $ref: '#/components/schemas/mongoId'
              instructionsToVendor:
                type: string
                maxLength: 10000
              approvedByOwner:
                type: boolean
              billed:
                type: boolean
                description: Read Only. If billed == true, the Vendor Bill Id be referenced under "vendorBill"
              vendorBill:
                $ref: '#/components/schemas/mongoId'
            required:
            - assignedToVendor
          entryPermission:
            type: string
            enum:
            - NOT_APPLICABLE
            - 'YES'
            - 'NO'
          createdAt:
            type: number
          updatedAt:
            type: number
        required:
        - type
        - subject
        - status
      type: object
    mongoId:
      type: string
      title: mongoId
      x-stoplight:
        id: 40j7qlmpihfdj
      pattern: /^[a-f\d]{24}$/i
      examples:
      - 507f191e810c19729de860ea
      example: 00000020f51bb4362eee2a4d
  securitySchemes:
    Key:
      type: apiKey
      in: header
      name: Authorization
      description: 'Bearer token. Create a key under Settings -> API access; it is a JWT. Example: `Authorization: Bearer eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.<payload>.<signature>`'
