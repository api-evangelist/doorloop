openapi: 3.2.0
info:
  title: DoorLoop API Reference Reports API
  version: '1.0'
  summary: This is the DoorLoop API
  description: It does some pretty cool stuff and gives you complete access to DoorLoop's data
  license:
    name: Terms and Conditions
    url: https://www.doorloop.com/legal/terms
  contact:
    name: DoorLoop Inc.
    url: www.doorloop.com
    email: support@doorloop.com
  termsOfService: https://www.doorloop.com/legal/terms
servers:
- url: https://app.doorloop.com/api
  description: Production
tags:
- name: Reports
paths:
  /reports/balance-sheet-summary:
    parameters: []
    get:
      summary: Balance Sheet
      tags:
      - Reports
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/profitAndLossReportItem'
              examples: {}
      operationId: get-reports-balance-sheet
      security:
      - Key: []
      parameters:
      - schema:
          type: string
        in: query
        name: filter_group
        description: Filter by Portfolio Id
      - schema:
          type: string
        in: query
        name: filter_property
        description: Filter by Property Id
      - schema:
          type: string
        in: query
        name: filter_propertyOwner
        description: Filter by Owner Id
      - schema:
          type: string
          enum:
          - CASH
          - ACCRUAL
        in: query
        name: filter_accountingMethod
        required: true
        description: Cash / Accrual
      - schema:
          type: string
        in: query
        name: filter_date_from
        description: 'Format: YYYY-MM-DD'
      - schema:
          type: string
        in: query
        name: filter_date_to
        description: 'Format: YYYY-MM-DD'
      description: ''
  /reports/cash-flow-statement:
    parameters: []
    get:
      summary: Cash Flow Statement
      tags:
      - Reports
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/profitAndLossReportItem'
              examples: {}
      operationId: get-reports-cash-flow-statement
      security:
      - Key: []
      parameters:
      - schema:
          type: string
        in: query
        name: filter_group
        description: Filter by Portfolio Id
      - schema:
          type: string
        in: query
        name: filter_property
        description: Filter by Property Id
      - schema:
          type: string
        in: query
        name: filter_propertyOwner
        description: Filter by Owner Id
      - schema:
          type: string
          enum:
          - CASH
          - ACCRUAL
        in: query
        name: filter_accountingMethod
        required: true
        description: Cash / Accrual
      - schema:
          type: string
        in: query
        name: filter_date_from
        description: 'Format: YYYY-MM-DD'
      - schema:
          type: string
        in: query
        name: filter_date_to
        description: 'Format: YYYY-MM-DD'
      description: ''
  /reports/profit-and-loss-summary:
    parameters: []
    get:
      summary: Profit & Loss
      tags:
      - Reports
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/profitAndLossReportItem'
              examples:
                example-1:
                  value:
                    columns:
                    - title: string
                      field: string
                    data:
                    - accountType: string
                      accountName: string
                      accountId: string
                      rootAccount: true
                      parentAccountId: null
                      total: 0
                      totalWithSubAccounts: 0
                      groupBy:
                        ? ''
                        : string
      operationId: get-reports-profit-and-loss
      security:
      - Key: []
      parameters:
      - schema:
          type: string
        in: query
        name: filter_group
        description: Filter by Portfolio Id
      - schema:
          type: string
        in: query
        name: filter_property
        description: Filter by Property Id
      - schema:
          type: string
        in: query
        name: filter_propertyOwner
        description: Filter by Owner Id
      - schema:
          type: string
          enum:
          - CASH
          - ACCRUAL
        in: query
        name: filter_accountingMethod
        required: true
        description: Cash / Accrual
      - schema:
          type: string
        in: query
        name: filter_date_from
        description: 'Format: YYYY-MM-DD'
      - schema:
          type: string
        in: query
        name: filter_date_to
        description: 'Format: YYYY-MM-DD'
      description: ''
  /reports/rent-roll:
    get:
      summary: Rent Roll
      tags:
      - Reports
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                x-examples:
                  example-1:
                    active: true
                    unitId: 601aad8e4fdad2298bb88162
                    unitName: '12'
                    unitAmenities: []
                    beds: 1
                    baths: 2
                    size: 1111
                    bedsAndBaths: 1/2
                    marketRent: 1000
                    property: 601aad884fdad2298bb88158
                    pictures: []
                    occupied: true
                    leaseId: 601aada84fdad2298bb881a8
                    leaseName: Tenant Portal7 & Tenant Portal8
                    start: '2021-02-03'
                    end: '2023-01-07'
                    term: Fixed
                    totalRecurringRent: 1000
                    rentPerSize: 0.9000900090009001
                    totalBalanceDue: 2000
                    leaseStatus: PAST_DUE
                    totalDepositsHeld: 0
                    renewalStage: NOT_STARTED
                    totalRecurringCharges: 0
                    totalRecurringCredits: 0
                    totalRecurringPayments: 0
                    lastPaymentDate: '2021-02-23'
                    lastPaymentAmount: 1000
                    lastReturnedPaymentDate: '2021-05-01'
                    lastReturnedPaymentAmount: -1000
                properties:
                  active:
                    type: boolean
                  unitId:
                    type: string
                  unitName:
                    type: string
                  unitAmenities:
                    type: array
                    items:
                      type: string
                  beds:
                    type: integer
                  baths:
                    type: integer
                  size:
                    type: number
                  bedsAndBaths:
                    type: string
                  marketRent:
                    type: number
                  property:
                    $ref: '#/components/schemas/mongoId'
                  pictures:
                    type: array
                    items:
                      type: object
                      properties:
                        rank:
                          type: integer
                        url:
                          type: string
                  occupied:
                    type: boolean
                  leaseId:
                    $ref: '#/components/schemas/mongoId'
                  leaseName:
                    type: string
                  start:
                    type: string
                  end:
                    type: string
                  term:
                    type: string
                    enum:
                    - FIXED
                    - AT_WILL
                  totalRecurringRent:
                    type: number
                  rentPerSize:
                    type: number
                  totalBalanceDue:
                    type: number
                  leaseStatus:
                    type: string
                    enum:
                    - ACTIVE
                    - INACTIVE
                  totalDepositsHeld:
                    type: number
                  renewalStage:
                    type: string
                    enum:
                    - NOT_STARTED
                    - RENEWAL_DRAFT
                    - RENEWAL_OFFER
                    - NOT_RENEWING
                  totalRecurringCharges:
                    type: number
                  totalRecurringCredits:
                    type: number
                  totalRecurringPayments:
                    type: number
                  lastPaymentDate:
                    type: string
                    description: 'Format: YYYY-MM-DD'
                  lastPaymentAmount:
                    type: number
                  lastReturnedPaymentDate:
                    type: string
                    description: 'Format: YYYY-MM-DD'
                  lastReturnedPaymentAmount:
                    type: number
                  nextLeaseId:
                    $ref: '#/components/schemas/mongoId'
                  nextLeaseName:
                    type: string
                  nextLeaseStart:
                    type: string
                    description: 'Format: YYYY-MM-DD'
                  rolloverToAtWill:
                    type: boolean
      operationId: get-reports-rent-roll
      security:
      - Key: []
      parameters:
      - schema:
          type: string
        in: query
        name: filter_group
        description: Filter by Portfolio Id
      - schema:
          type: string
        in: query
        name: filter_property
        description: Filter by Property Id
      - schema:
          type: string
        in: query
        name: filter_owner
        description: Filter by Owner Id
      - schema:
          type: string
        in: query
        name: filter_asOfDate
        description: 'Format: YYYY-MM-DD'
      description: ''
components:
  schemas:
    mongoId:
      type: string
      title: mongoId
      x-stoplight:
        id: 40j7qlmpihfdj
      pattern: /^[a-f\d]{24}$/i
      examples:
      - 507f191e810c19729de860ea
      example: 00000020f51bb4362eee2a4d
    profitAndLossReportItem:
      type: object
      properties:
        columns:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              field:
                type: string
        data:
          type: array
          items:
            type: object
            properties:
              accountType:
                type: string
              accountName:
                type: string
              accountId:
                type: string
              rootAccount:
                type: boolean
              parentAccountId:
                type: 'null'
              total:
                type: integer
              totalWithSubAccounts:
                type: integer
              groupBy:
                type: object
                properties:
                  ? ''
                  : type: string
      x-examples:
        example-1:
          columns:
          - title: string
            field: string
          data:
          - accountType: string
            accountName: string
            accountId: string
            rootAccount: true
            parentAccountId: null
            total: 0
            totalWithSubAccounts: 0
            groupBy:
              ? ''
              : string
  securitySchemes:
    Key:
      type: apiKey
      in: header
      name: Authorization
      description: 'Bearer token. Create a key under Settings -> API access; it is a JWT. Example: `Authorization: Bearer eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.<payload>.<signature>`'
