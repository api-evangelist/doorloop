openapi: 3.2.0
info:
  title: DoorLoop API Reference Owners API
  version: '1.0'
  summary: This is the DoorLoop API
  description: It does some pretty cool stuff and gives you complete access to DoorLoop's data
  license:
    name: Terms and Conditions
    url: https://www.doorloop.com/legal/terms
  contact:
    name: DoorLoop Inc.
    url: www.doorloop.com
    email: support@doorloop.com
  termsOfService: https://www.doorloop.com/legal/terms
servers:
- url: https://app.doorloop.com/api
  description: Production
tags:
- name: Owners
paths:
  /owners:
    get:
      summary: List all Owners
      tags:
      - Owners
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/owner'
      operationId: get-owners
      description: Lists all Owners
      security:
      - Key: []
      parameters:
      - schema:
          type: string
        in: query
        name: filter_group
        description: Filter by Portfolio Id
      - schema:
          type: string
        in: query
        name: filter_property
        description: Filter by Property Id
      - schema:
          type: boolean
        in: query
        name: filter_active
        description: Filter by Active/Inactive
      - schema:
          type: string
        in: query
        name: filter_text
        description: Filter by Owner Name / Email
      - schema:
          type: string
        in: query
        name: filter_management_ends_before
        description: 'Format: YYYY-MM-DD'
      - schema:
          type: string
        in: query
        name: filter_createdAt_from
        description: 'Format: YYYY-MM-DD'
      - schema:
          type: string
        in: query
        name: filter_createdAt_to
        description: 'Format: YYYY-MM-DD'
    post:
      summary: Create an Owner
      operationId: post-owner
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/owner'
        '400':
          description: Bad Request
      tags:
      - Owners
      description: Creates an Owner
      security:
      - Key: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/owner'
  /owners/{ownerId}:
    parameters:
    - schema:
        type: string
      name: ownerId
      in: path
      required: true
    get:
      summary: Retrieve an Owner
      tags:
      - Owners
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/owner'
        '400':
          description: Bad Request
        '404':
          description: Not Found
      operationId: get-owner
      security:
      - Key: []
      description: Retrieves an Owner
    put:
      summary: Update an Owner
      operationId: put-owner
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/owner'
        '400':
          description: Bad Request
        '404':
          description: Not Found
      description: Updates an Owner
      security:
      - Key: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/owner'
      tags:
      - Owners
    delete:
      summary: Delete an Owner
      operationId: delete-owner
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/owner'
        '400':
          description: Bad Request
        '404':
          description: Not Found
      description: Deletes an Owner
      security:
      - Key: []
      tags:
      - Owners
components:
  schemas:
    phone:
      title: phone
      x-stoplight:
        id: 9kqyepto63cpi
      type: object
      properties:
        type:
          type: string
          enum:
          - Home
          - Work
          - Mobile
          - Fax
          - Other
        number:
          type: string
          maxLength: 50
      required:
      - type
      - number
    mongoId:
      type: string
      title: mongoId
      x-stoplight:
        id: 40j7qlmpihfdj
      pattern: /^[a-f\d]{24}$/i
      examples:
      - 507f191e810c19729de860ea
      example: 00000020f51bb4362eee2a4d
    email:
      title: email
      x-stoplight:
        id: 33vnq3pmvuy4l
      type: object
      properties:
        type:
          type: string
          enum:
          - Primary
          - Secondary
          - Personal
          - Work
          - Other
        address:
          type: string
      required:
      - type
      - address
    person:
      title: person
      x-stoplight:
        id: w8ihhyv3ctmy8
      type: object
      description: ''
      properties:
        id:
          $ref: '#/components/schemas/mongoId'
        name:
          type: string
          description: Read Only
        firstName:
          type: string
        middleName:
          type: string
        lastName:
          type: string
        gender:
          type: string
          enum:
          - MALE
          - FEMALE
          - PREFER_NOT_TO_SAY
        fullName:
          type: string
          description: Read Only
        dateOfBirth:
          type: string
          description: 'Format: YYYY-MM-DD'
        timezone:
          type: string
        company:
          type: string
        companyName:
          type: string
        jobTitle:
          type: string
        notes:
          type: string
        phones:
          type: array
          items:
            $ref: '#/components/schemas/phone'
        emails:
          type: array
          items:
            $ref: '#/components/schemas/email'
        primaryAddress:
          $ref: '#/components/schemas/address'
        pictureUrl:
          type: string
        ? ''
        : type: string
      required:
      - firstName
      - lastName
    federalTaxInfo:
      title: federalTaxInfo
      x-stoplight:
        id: d1fvqgbj6zgev
      type: object
      properties:
        addressFor1099SameAsPrimaryAddress:
          type: boolean
          description: If set to "true", will use the primaryAddress on the 1099 form. Otherwise addressFor1099 will be required.
        addressFor1099:
          $ref: '#/components/schemas/address'
        taxpayerName:
          type: string
        taxpayerId:
          type: string
      required:
      - addressFor1099SameAsPrimaryAddress
      - taxpayerName
      - taxpayerId
    owner:
      allOf:
      - $ref: '#/components/schemas/person'
      - type: object
        properties:
          active:
            type: boolean
          managementStartDate:
            type: string
            description: 'Format: YYYY-MM-DD'
          managementEndDate:
            type: string
            description: 'Format: YYYY-MM-DD'
          federalTaxInfo:
            $ref: '#/components/schemas/federalTaxInfo'
        required:
        - active
    address:
      title: address
      x-stoplight:
        id: a6vhbqoeituyk
      type: object
      description: ''
      properties:
        street1:
          type: string
        street2:
          type: string
        city:
          type: string
        zip:
          type: string
        country:
          type: string
        lat:
          type: string
        lng:
          type: string
  securitySchemes:
    Key:
      type: apiKey
      in: header
      name: Authorization
      description: 'Bearer token. Create a key under Settings -> API access; it is a JWT. Example: `Authorization: Bearer eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.<payload>.<signature>`'
