openapi: 3.2.0
info:
  title: DoorLoop API Reference Lease Charges API
  version: '1.0'
  summary: This is the DoorLoop API
  description: It does some pretty cool stuff and gives you complete access to DoorLoop's data
  license:
    name: Terms and Conditions
    url: https://www.doorloop.com/legal/terms
  contact:
    name: DoorLoop Inc.
    url: www.doorloop.com
    email: support@doorloop.com
  termsOfService: https://www.doorloop.com/legal/terms
servers:
- url: https://app.doorloop.com/api
  description: Production
tags:
- name: Lease Charges
paths:
  /lease-charges:
    parameters: []
    get:
      summary: List all Lease Charges
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: number
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/leaseTransaction'
              examples: {}
            application/xml:
              schema:
                type: object
                properties: {}
            multipart/form-data:
              schema:
                type: object
                properties: {}
        '400':
          description: Bad Request
      operationId: get-lease-charges
      description: Lists all Lease Charges
      parameters:
      - schema:
          type: string
        in: query
        name: filter_lease
        description: Filter by Lease Id
      - schema:
          type: string
        in: query
        name: filter_property
        description: Filter by Property Id
      - schema:
          type: string
        in: query
        name: filter_owner
        description: Filter by Owner Id
      - schema:
          type: string
        in: query
        description: Filter by Date (YYYY-MM-DD)
        name: filter_date_from
      - schema:
          type: string
        in: query
        description: Filter by Date (YYYY-MM-DD)
        name: filter_date_to
      - schema:
          type: number
        in: query
        name: filter_totalBalanceGreaterThan
        description: Return only charges whose remaining balance exceeds this value. Use 0 to get all open (unpaid) charges.
      - schema:
          type: boolean
        in: query
        name: filter_lateFeeCharges
        description: Return only late-fee charges
      - schema:
          type: boolean
        in: query
        name: filter_excludeAutomaticLateFeeCharges
        description: Exclude late fees that were generated automatically by DoorLoop
      - schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        in: query
        name: filter_accounts
        description: Return only charges whose lines reference one of these account ids. Array parameter - send as filter_accounts[]=<id>. A bare scalar value is rejected with a 400.
      - schema:
          type: string
        in: query
        name: filter_unit
        description: Return only charges on leases for this unit
      - $ref: '#/components/parameters/page_number'
      - $ref: '#/components/parameters/page_size'
      security:
      - Key: []
      tags:
      - Lease Charges
    post:
      summary: Create a Lease Charge
      operationId: post-lease-charge
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/leaseTransaction'
        '400':
          description: Bad Request
      security:
      - Key: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/leaseTransaction'
      description: Created a Lease Charge
      tags:
      - Lease Charges
  /lease-charges/{leaseChargeId}:
    parameters:
    - schema:
        type: string
      name: leaseChargeId
      in: path
      required: true
    get:
      summary: Retrieve a Lease Charge
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/leaseTransaction'
              examples: {}
            application/xml:
              schema:
                type: object
                properties: {}
            multipart/form-data:
              schema:
                type: object
                properties: {}
        '404':
          description: Not Found
      operationId: get-lease-charge
      description: Retrieves a Lease Charge
      parameters: []
      security:
      - Key: []
      tags:
      - Lease Charges
    put:
      summary: Update a Lease Charge
      operationId: put-lease-charge
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/leaseTransaction'
        '400':
          description: Bad Request
        '404':
          description: Not Found
      security:
      - Key: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/leaseTransaction'
      tags:
      - Lease Charges
      description: ''
    delete:
      summary: Delete a Lease Credit
      operationId: delete-lease-charge
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/leaseTransaction'
      security:
      - Key: []
      tags:
      - Lease Charges
      description: Deletes a Lease Credit
components:
  schemas:
    leaseTransactionLine:
      title: leaseTransactionLine
      x-stoplight:
        id: fc1wegnped57j
      type: object
      properties:
        id:
          $ref: '#/components/schemas/mongoId'
        amount:
          type: number
        account:
          type: string
          description: References the Account Id for this line.
        memo:
          type: string
          maxLength: 1000
        balance:
          type: number
          readOnly: true
          description: Remaining unpaid amount on this line. `amount` is the original charged amount, so the amount paid is `amount - balance`.
      required:
      - amount
      - account
    mongoId:
      type: string
      title: mongoId
      x-stoplight:
        id: 40j7qlmpihfdj
      pattern: /^[a-f\d]{24}$/i
      examples:
      - 507f191e810c19729de860ea
      example: 00000020f51bb4362eee2a4d
    leaseTransaction:
      title: journalEntry
      x-stoplight:
        id: j92801xr8v1ta
      allOf:
      - properties:
          lease:
            $ref: '#/components/schemas/mongoId'
          lines:
            type: array
            items:
              $ref: '#/components/schemas/leaseTransactionLine'
          memo:
            type: string
            maxLength: 1000
          reference:
            type: string
            description: If not provided one will be generated by the server
            maxLength: 50
          date:
            type: string
            description: 'Format: YYYY-MM-DD'
          batch:
            type: string
        required:
        - lease
        - lines
        - date
      type: object
  parameters:
    page_size:
      name: page_size
      in: query
      required: false
      description: Rows per page. Defaults to 50. Values above 1000 are rejected with a 400.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 50
    page_number:
      name: page_number
      in: query
      required: false
      description: 1-based page index. Pages are disjoint. Every list response includes a total.
      schema:
        type: integer
        minimum: 1
        default: 1
  securitySchemes:
    Key:
      type: apiKey
      in: header
      name: Authorization
      description: 'Bearer token. Create a key under Settings -> API access; it is a JWT. Example: `Authorization: Bearer eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.<payload>.<signature>`'
