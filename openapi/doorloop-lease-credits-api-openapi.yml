info:
  title: DoorLoop API Reference Lease Credits API
  version: '1.0'
  summary: This is the DoorLoop API
  description: It does some pretty cool stuff and gives you complete access to DoorLoop's data
  license:
    name: Terms and Conditions
    url: https://www.doorloop.com/legal/terms
  contact:
    name: DoorLoop Inc.
    url: www.doorloop.com
    email: support@doorloop.com
  termsOfService: https://www.doorloop.com/legal/terms
servers:
- url: https://app.doorloop.com/api
  description: Production
tags:
- name: Lease Credits
paths:
  /lease-credits:
    parameters: []
    get:
      summary: List all Lease Credits
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: number
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/leaseTransaction'
              examples: {}
            application/xml:
              schema:
                type: object
                properties: {}
            multipart/form-data:
              schema:
                type: object
                properties: {}
        '400':
          description: Bad Request
      operationId: get-lease-credits
      description: Lists all Lease Credits
      parameters:
      - schema:
          type: string
        in: query
        name: filter_lease
        description: Filter by Lease Id
      - schema:
          type: string
        in: query
        name: filter_property
        description: Filter by Property Id
      - schema:
          type: string
        in: query
        name: filter_owner
        description: Filter by Owner Id
      - schema:
          type: string
        in: query
        name: filter_date_from
        description: Filter by Date (YYYY-MM-DD)
      - schema:
          type: string
        in: query
        name: filter_date_to
        description: Filter by Date (YYYY-MM-DD)
      security:
      - Key: []
      tags:
      - Lease Credits
    post:
      summary: Create a Lease Credit
      operationId: post-lease-credit
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/leaseTransaction'
      tags:
      - Lease Credits
      security:
      - Key: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/leaseTransaction'
      description: Creates a Lease Credit
  /lease-credits/{leaseCreditId}:
    parameters:
    - schema:
        type: string
      name: leaseCreditId
      in: path
      required: true
    get:
      summary: Retrieve a Lease Credit
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/leaseTransaction'
              examples: {}
            application/xml:
              schema:
                type: object
                properties: {}
            multipart/form-data:
              schema:
                type: object
                properties: {}
        '404':
          description: Not Found
      operationId: get-lease-credit
      description: Retrieves a Lease Credits
      parameters: []
      security:
      - Key: []
      tags:
      - Lease Credits
    put:
      summary: Update a Lease Credit
      operationId: put-lease-credit
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/leaseTransaction'
        '400':
          description: Bad Request
        '404':
          description: Not Found
      security:
      - Key: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/leaseTransaction'
      description: Updates a Lease Credit
      tags:
      - Lease Credits
    delete:
      summary: Delete a Lease Credit
      operationId: delete-lease-credits-leaseCreditId
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/leaseTransaction'
        '400':
          description: Bad Request
        '404':
          description: Not Found
      tags:
      - Lease Credits
      description: Delete Lease Credits
components:
  schemas:
    leaseTransactionLine:
      title: leaseTransactionLine
      x-stoplight:
        id: fc1wegnped57j
      type: object
      properties:
        id:
          $ref: '#/components/schemas/mongoId'
        amount:
          type: number
        account:
          type: string
          description: References the Account Id for this line.
        memo:
          type: string
          maxLength: 1000
        balance:
          type: number
          readOnly: true
          description: Remaining unpaid amount on this line. `amount` is the original charged amount, so the amount paid is `amount - balance`.
      required:
      - amount
      - account
    mongoId:
      type: string
      title: mongoId
      x-stoplight:
        id: 40j7qlmpihfdj
      pattern: /^[a-f\d]{24}$/i
      examples:
      - 507f191e810c19729de860ea
      example: 00000020f51bb4362eee2a4d
    leaseTransaction:
      title: journalEntry
      x-stoplight:
        id: j92801xr8v1ta
      allOf:
      - properties:
          lease:
            $ref: '#/components/schemas/mongoId'
          lines:
            type: array
            items:
              $ref: '#/components/schemas/leaseTransactionLine'
          memo:
            type: string
            maxLength: 1000
          reference:
            type: string
            description: If not provided one will be generated by the server
            maxLength: 50
          date:
            type: string
            description: 'Format: YYYY-MM-DD'
          batch:
            type: string
        required:
        - lease
        - lines
        - date
      type: object
  securitySchemes:
    Key:
      type: apiKey
      in: header
      name: Authorization
      description: 'Bearer token. Create a key under Settings -> API access; it is a JWT. Example: `Authorization: Bearer eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.<payload>.<signature>`'
x-stoplight:
  id: cz75kvx8cjg25
