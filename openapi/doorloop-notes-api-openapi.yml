openapi: 3.2.0
info:
  title: DoorLoop API Reference Notes API
  version: '1.0'
  summary: This is the DoorLoop API
  description: It does some pretty cool stuff and gives you complete access to DoorLoop's data
  license:
    name: Terms and Conditions
    url: https://www.doorloop.com/legal/terms
  contact:
    name: DoorLoop Inc.
    url: www.doorloop.com
    email: support@doorloop.com
  termsOfService: https://www.doorloop.com/legal/terms
servers:
- url: https://app.doorloop.com/api
  description: Production
tags:
- name: Notes
paths:
  /notes:
    get:
      summary: List all Notes
      tags:
      - Notes
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: number
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/note'
      operationId: get-notes
      description: Lists all Notes
      security:
      - Key: []
      parameters:
      - schema:
          type: string
        in: query
        name: filter_createdAt_from
        description: 'Format: YYYY-MM-DD'
      - schema:
          type: string
        in: query
        name: filter_createdAt_to
        description: 'Format: YYYY-MM-DD'
      - schema:
          type: string
        in: query
        name: filter_resourceId
      - schema:
          type: string
        in: query
        name: filter_createdBy
      - schema:
          type: string
        in: query
        name: filter_tags
      - schema:
          type: string
        in: query
        name: filter_text
        description: Filter by Note Title or Body
    post:
      summary: Create a Note
      operationId: post-notes
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/note'
        '400':
          description: Bad Request
      tags:
      - Notes
      description: Creates a Note
      security:
      - Key: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/note'
  /notes/{noteId}:
    parameters:
    - schema:
        type: string
      name: noteId
      in: path
      required: true
    get:
      summary: Retrieve a Note
      tags:
      - Notes
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/note'
      operationId: get-note
      security:
      - Key: []
    put:
      summary: Update a Note
      operationId: put-note
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/note'
        '400':
          description: Bad Request
        '404':
          description: Not Found
      tags:
      - Notes
      description: Updates a Note
      security:
      - Key: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/note'
    delete:
      summary: Delete a Note
      operationId: delete-note
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/note'
        '400':
          description: Bad Request
        '404':
          description: Not Found
      description: Deletes a Note
      security:
      - Key: []
      tags:
      - Notes
components:
  schemas:
    mongoId:
      type: string
      title: mongoId
      x-stoplight:
        id: 40j7qlmpihfdj
      pattern: /^[a-f\d]{24}$/i
      examples:
      - 507f191e810c19729de860ea
      example: 00000020f51bb4362eee2a4d
    note:
      title: note
      x-stoplight:
        id: g3gxurg6g7l2i
      type: object
      properties:
        id:
          $ref: '#/components/schemas/mongoId'
        title:
          type: string
          maxLength: 255
        body:
          type: string
          maxLength: 10000
        tags:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/mongoId'
        linkedResource:
          $ref: '#/components/schemas/noteLinkedResource'
        createdAt:
          description: Read Only
          type: number
        createdBy:
          type: string
          description: Read Only
      required:
      - title
      - linkedResource
    noteLinkedResource:
      title: noteLinkedResource
      x-stoplight:
        id: tdd2wdxg0yyjm
      type: object
      properties:
        resourceId:
          $ref: '#/components/schemas/mongoId'
        resourceType:
          type: string
          enum:
          - TENANT
          - OWNER
          - VENDOR
          - PROPERTY
          - UNIT
          - LEASE
          - LEASE_DRAFT
          - TASK
          - RENTAL_APPLICATION
      required:
      - resourceId
      - resourceType
  securitySchemes:
    Key:
      type: apiKey
      in: header
      name: Authorization
      description: 'Bearer token. Create a key under Settings -> API access; it is a JWT. Example: `Authorization: Bearer eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.<payload>.<signature>`'
x-stoplight:
  id: cz75kvx8cjg25
