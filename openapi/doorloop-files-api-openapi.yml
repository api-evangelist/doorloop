openapi: 3.2.0
info:
  title: DoorLoop API Reference Files API
  version: '1.0'
  summary: This is the DoorLoop API
  description: It does some pretty cool stuff and gives you complete access to DoorLoop's data
  license:
    name: Terms and Conditions
    url: https://www.doorloop.com/legal/terms
  contact:
    name: DoorLoop Inc.
    url: www.doorloop.com
    email: support@doorloop.com
  termsOfService: https://www.doorloop.com/legal/terms
servers:
- url: https://app.doorloop.com/api
  description: Production
tags:
- name: Files
paths:
  /files:
    get:
      summary: List all Files
      tags:
      - Files
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/file'
      operationId: get-files
      description: Lists all Files
      security:
      - Key: []
      parameters:
      - schema:
          type: string
        in: query
        name: filter_resourceId
      - schema:
          type: string
        in: query
        name: filter_createdAt_from
        description: 'Format: YYYY-MM-DD'
      - schema:
          type: string
        in: query
        name: filter_createdAt_to
        description: 'Format: YYYY-MM-DD'
      - schema:
          type: string
        in: query
        name: filter_createdBy
      - schema:
          type: string
        in: query
        name: filter_tags
      - schema:
          type: string
        in: query
        name: filter_text
        description: Filter by File Name or Notes
    post:
      summary: Upload a File
      operationId: post-files
      responses:
        '200':
          description: OK
      description: Upoads a File
      security:
      - Key: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              allOf:
              - $ref: '#/components/schemas/file'
              - type: object
                properties:
                  file:
                    description: The binary file data. Max file size 50MB.
                    type: array
                    items:
                      type: string
                required:
                - file
        description: ''
      tags:
      - Files
  /files/{fileId}:
    parameters:
    - schema:
        type: string
      name: fileId
      in: path
      required: true
    get:
      summary: Retrieve a File
      tags:
      - Files
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/file'
        '400':
          description: Bad Request
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/file'
      operationId: get-file
      description: Retrieves a File Metadata
      security:
      - Key: []
    put:
      summary: Update a File
      operationId: put-file
      responses:
        '200':
          description: OK
      tags:
      - Files
      description: Updates a File Metadata
    delete:
      summary: Delete a File
      operationId: delete-file
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/file'
        '400':
          description: Bad Request
        '404':
          description: Not Found
      tags:
      - Files
      description: Deletes a File
      security:
      - Key: []
  /files/{fileId}/download:
    parameters:
    - schema:
        type: string
      name: fileId
      in: path
      required: true
    get:
      summary: Download a File
      tags:
      - Files
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/file'
      operationId: download-file
      description: Downloads a File
      security:
      - Key: []
components:
  schemas:
    file:
      title: file
      x-stoplight:
        id: 1125csq7d6u3b
      type: object
      properties:
        id:
          $ref: '#/components/schemas/mongoId'
        name:
          type: string
          description: The name of the file. Must be a valid unix file name.
          maxLength: 255
        notes:
          type: string
        linkedResource:
          $ref: '#/components/schemas/fileLinkedResource'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/mongoId'
        size:
          type: number
        mimeType:
          type: string
        createdBy:
          type: string
        createdAt:
          type: string
        downloadUrl:
          type: string
          description: Read Only. References the URL from which this file can be downloaded
      required:
      - name
      - linkedResource
    fileLinkedResource:
      title: fileLinkedResource
      x-stoplight:
        id: tdd2wdxg0yyjm
      type: object
      description: ''
      properties:
        resourceId:
          $ref: '#/components/schemas/mongoId'
        resourceType:
          type: string
          enum:
          - TENANT
          - OWNER
          - VENDOR
          - PROPERTY
          - UNIT
          - LEASE
          - LEASE_DRAFT
          - TASK
          - RENTAL_APPLICATION
          - BILL
          - BILL_PAYMENT
          - VENDOR_CREDIT
          - NOTE
          - INSURANCE_POLICY
          - COMMUNICATION
      required:
      - resourceId
      - resourceType
    mongoId:
      type: string
      title: mongoId
      x-stoplight:
        id: 40j7qlmpihfdj
      pattern: /^[a-f\d]{24}$/i
      examples:
      - 507f191e810c19729de860ea
      example: 00000020f51bb4362eee2a4d
  securitySchemes:
    Key:
      type: apiKey
      in: header
      name: Authorization
      description: 'Bearer token. Create a key under Settings -> API access; it is a JWT. Example: `Authorization: Bearer eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.<payload>.<signature>`'
x-stoplight:
  id: cz75kvx8cjg25
