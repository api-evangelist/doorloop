openapi: 3.2.0
info:
  title: DoorLoop API Reference Expenses API
  version: '1.0'
  summary: This is the DoorLoop API
  description: It does some pretty cool stuff and gives you complete access to DoorLoop's data
  license:
    name: Terms and Conditions
    url: https://www.doorloop.com/legal/terms
  contact:
    name: DoorLoop Inc.
    url: www.doorloop.com
    email: support@doorloop.com
  termsOfService: https://www.doorloop.com/legal/terms
servers:
- url: https://app.doorloop.com/api
  description: Production
tags:
- name: Expenses
paths:
  /expenses:
    get:
      summary: List all Expenses
      tags:
      - Expenses
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/expense'
      operationId: get-expenses
      description: Lists all Expenses
      security:
      - Key: []
      parameters:
      - schema:
          type: string
        in: query
        name: filter_group
        description: Filter by Portfolio Id
      - schema:
          type: string
        in: query
        name: filter_property
        description: Filter by Property Id
      - schema:
          type: string
        in: query
        name: filter_vendor
        description: Filter by Vendor Id
      - schema:
          type: string
        in: query
        name: filter_tenant
        description: Filter by Tenant Id
      - schema:
          type: string
        in: query
        name: filter_owner
        description: Filter by Owner Id
      - schema:
          type: string
        in: query
        name: filter_payFromAccount
        description: Filter by Pay From Account Id
      - schema:
          type: string
        in: query
        name: filter_date_from
        description: 'Format: YYYY-MM-DD'
      - schema:
          type: string
        in: query
        name: filter_date_to
        description: 'Format: YYYY-MM-DD'
    post:
      summary: Create an Expense
      operationId: post-expense
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/expense'
        '400':
          description: Bad Request
      tags:
      - Expenses
      description: Creates an Expense
      security:
      - Key: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/expense'
  /expenses/{expenseId}:
    parameters:
    - schema:
        type: string
      name: expenseId
      in: path
      required: true
    get:
      summary: Retrieve an Expense
      tags:
      - Expenses
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/expense'
        '400':
          description: Bad Request
        '404':
          description: Not Found
      operationId: get-expense
      description: Retrieves an Expense
      security:
      - Key: []
    put:
      summary: Update an Expense
      operationId: put-expense
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/expense'
        '400':
          description: Bad Request
        '404':
          description: Not Found
      description: Updates an Expense
      security:
      - Key: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/expense'
      tags:
      - Expenses
    delete:
      summary: Delete an Expense
      operationId: delete-expense
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/expense'
        '400':
          description: Bad Request
        '404':
          description: Not Found
      tags:
      - Expenses
      description: Deletes an Expense
      security:
      - Key: []
components:
  schemas:
    mongoId:
      type: string
      title: mongoId
      x-stoplight:
        id: 40j7qlmpihfdj
      pattern: /^[a-f\d]{24}$/i
      examples:
      - 507f191e810c19729de860ea
      example: 00000020f51bb4362eee2a4d
    expense:
      title: expense
      x-stoplight:
        id: kznbaq3e7rwg2
      type: object
      properties:
        id:
          $ref: '#/components/schemas/mongoId'
        payFromAccount:
          type: string
        paymentMethod:
          $ref: '#/components/schemas/paymentMethods'
        payToResourceType:
          type: string
        payToResourceId:
          type: string
        lines:
          type: array
          items:
            $ref: '#/components/schemas/expenseTransactionLine'
        memo:
          type: string
          maxLength: 1000
        reference:
          type: string
          maxLength: 255
          description: If not provided will be generated automatically by the server.
        date:
          type: string
          description: 'Format: YYYY-MM-DD'
        batch:
          type: string
        totalAmount:
          type: number
          description: Read Only. Calculated as sum of lines.amount.
      required:
      - payFromAccount
      - paymentMethod
      - lines
      - date
      examples: []
    expenseTransactionLine:
      title: expenseTransactionLine
      x-stoplight:
        id: i2oe5ol30qri6
      type: object
      properties:
        id:
          $ref: '#/components/schemas/mongoId'
        amount:
          type: number
        account:
          $ref: '#/components/schemas/mongoId'
        memo:
          type: string
          maxLength: 1000
        linkedToResourceType:
          type: string
          description: At the monent, only "property" is supported
          enum:
          - property
        linkedToResourceId:
          type: string
          description: The Property Id for this line.
        balance:
          description: Read Only
          type: number
      required:
      - account
      - linkedToResourceType
      - linkedToResourceId
    paymentMethods:
      type: string
      enum:
      - CASH
      - CHECK
      - CREDIT_CARD
      - CASHIERS_CHECK
      - MONEY_ORDER
      - EFT
      - DEBIT_CARD
      - OTHER
      - EPAY
      description: Lists all possible payment methods that can be used in payable and receivable transactions. Use EFT to record an electronic funds transfer that was collected outside DoorLoop. EPAY is reserved for payments processed through DoorLoop's own merchant account and requires a nested ePayInfo object.
  securitySchemes:
    Key:
      type: apiKey
      in: header
      name: Authorization
      description: 'Bearer token. Create a key under Settings -> API access; it is a JWT. Example: `Authorization: Bearer eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.<payload>.<signature>`'
