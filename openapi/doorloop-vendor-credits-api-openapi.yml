openapi: 3.2.0
info:
  title: DoorLoop API Reference Vendor Credits API
  version: '1.0'
  summary: This is the DoorLoop API
  description: It does some pretty cool stuff and gives you complete access to DoorLoop's data
  license:
    name: Terms and Conditions
    url: https://www.doorloop.com/legal/terms
  contact:
    name: DoorLoop Inc.
    url: www.doorloop.com
    email: support@doorloop.com
  termsOfService: https://www.doorloop.com/legal/terms
servers:
- url: https://app.doorloop.com/api
  description: Production
tags:
- name: Vendor Credits
paths:
  /vendor-credits:
    parameters: []
    get:
      summary: List all Vendor Credits
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/vendorTransaction'
      operationId: get-vendor-credits
      description: Lists all Vendor Credits
      security:
      - Key: []
      parameters:
      - schema:
          type: string
        in: query
        name: filter_group
        description: Filter by Portfolio Id
      - schema:
          type: string
        in: query
        name: filter_property
        description: Filter by Property Id
      - schema:
          type: string
        in: query
        name: filter_vendor
        description: Filter by Vendor Id
      - schema:
          type: string
        in: query
        name: filter_date_from
        description: 'Format: YYYY-MM-DD'
      - schema:
          type: string
        in: query
        name: filter_date_to
        description: 'Format: YYYY-MM-DD'
      - schema:
          type: string
        in: query
        name: filter_due_date_from
        description: 'Format: YYYY-MM-DD'
      - schema:
          type: string
        in: query
        name: filter_due_date_to
        description: 'Format: YYYY-MM-DD'
      - schema:
          type: boolean
        in: query
        name: filter_openBills
        description: 'If set to true will return only bills with an open balance '
      tags:
      - Vendor Credits
    post:
      summary: Create a Vendor Credit
      operationId: post-vendor-credit
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/vendorTransaction'
        '400':
          description: Bad Request
      description: Creates a Vendor Credit
      security:
      - Key: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/vendorTransaction'
      tags:
      - Vendor Credits
  /vendor-credits/{vendorCreditId}:
    parameters:
    - schema:
        type: string
      name: vendorCreditId
      in: path
      required: true
    get:
      summary: Retrieve a Vendor Credit
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/vendorTransaction'
        '400':
          description: Bad Request
        '404':
          description: Not Found
      operationId: get-vendor-credit
      description: Retrieves a Vendor Credit
      security:
      - Key: []
      tags:
      - Vendor Credits
    put:
      summary: Update a Vendor Credit
      operationId: put-vendor-credit
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/vendorTransaction'
        '400':
          description: Bad Request
        '404':
          description: Not Found
      description: Updates a Vendor Credit
      security:
      - Key: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/vendorTransaction'
      tags:
      - Vendor Credits
    delete:
      summary: Delete a Vendor Credit
      operationId: delete-vendor-Credit
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/vendorTransaction'
        '400':
          description: Bad Request
        '404':
          description: Not Found
      description: Deletes a Vendor Credit
      security:
      - Key: []
      tags:
      - Vendor Credits
components:
  schemas:
    mongoId:
      type: string
      title: mongoId
      x-stoplight:
        id: 40j7qlmpihfdj
      pattern: /^[a-f\d]{24}$/i
      examples:
      - 507f191e810c19729de860ea
      example: 00000020f51bb4362eee2a4d
    expenseTransactionLine:
      title: expenseTransactionLine
      x-stoplight:
        id: i2oe5ol30qri6
      type: object
      properties:
        id:
          $ref: '#/components/schemas/mongoId'
        amount:
          type: number
        account:
          $ref: '#/components/schemas/mongoId'
        memo:
          type: string
          maxLength: 1000
        linkedToResourceType:
          type: string
          description: At the monent, only "property" is supported
          enum:
          - property
        linkedToResourceId:
          type: string
          description: The Property Id for this line.
        balance:
          description: Read Only
          type: number
      required:
      - account
      - linkedToResourceType
      - linkedToResourceId
    vendorTransaction:
      title: vendorTransaction
      x-stoplight:
        id: 1fqjs8q8lcqqh
      type: object
      properties:
        id:
          $ref: '#/components/schemas/mongoId'
        vendor:
          $ref: '#/components/schemas/mongoId'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/expenseTransactionLine'
        date:
          type: string
          description: 'Format: YYYY-MM-DD'
        dueDate:
          type: string
          description: 'Format: YYYY-MM-DD'
        memo:
          type: string
          maxLength: 1000
        reference:
          type: string
          description: If not provided wil be generated by the server.
          maxLength: 255
        batch:
          type: string
        totalAmount:
          type: number
          description: Read Only. Calculated by the server.
        totalBalance:
          type: number
          description: Read Only. Calculated by the server.
      required:
      - vendor
      - lines
      - date
      - dueDate
  securitySchemes:
    Key:
      type: apiKey
      in: header
      name: Authorization
      description: 'Bearer token. Create a key under Settings -> API access; it is a JWT. Example: `Authorization: Bearer eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.<payload>.<signature>`'
