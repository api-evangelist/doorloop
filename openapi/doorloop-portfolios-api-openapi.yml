info:
  title: DoorLoop API Reference Portfolios API
  version: '1.0'
  summary: This is the DoorLoop API
  description: It does some pretty cool stuff and gives you complete access to DoorLoop's data
  license:
    name: Terms and Conditions
    url: https://www.doorloop.com/legal/terms
  contact:
    name: DoorLoop Inc.
    url: www.doorloop.com
    email: support@doorloop.com
  termsOfService: https://www.doorloop.com/legal/terms
servers:
- url: https://app.doorloop.com/api
  description: Production
tags:
- name: Portfolios
paths:
  /property-groups:
    get:
      summary: List all Portfolios
      tags:
      - Portfolios
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: string
                  data:
                    $ref: '#/components/schemas/propertyGroup'
      operationId: get-property-groups
      security:
      - Key: []
      description: Lists all Portfolios
  /property-groups/{portfolioId}:
    parameters:
    - schema:
        type: string
      name: portfolioId
      in: path
      required: true
    get:
      summary: Retrieve a Portfolio
      tags:
      - Portfolios
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: string
                  data:
                    $ref: '#/components/schemas/propertyGroup'
      operationId: get-property-group
      security:
      - Key: []
      description: Retreieves a Portfolio
components:
  schemas:
    propertyGroup:
      title: ''
      x-stoplight:
        id: pmuqa1tixt7kj
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        properties:
          type: array
          description: An array of Property Ids for properties in this portfolio.
          items:
            type: string
      required:
      - name
      - properties
  securitySchemes:
    Key:
      type: apiKey
      in: header
      name: Authorization
      description: 'Bearer token. Create a key under Settings -> API access; it is a JWT. Example: `Authorization: Bearer eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.<payload>.<signature>`'
