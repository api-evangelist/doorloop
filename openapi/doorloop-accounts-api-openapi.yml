openapi: 3.2.0
info:
  title: DoorLoop API Reference Accounts API
  version: '1.0'
  summary: This is the DoorLoop API
  description: It does some pretty cool stuff and gives you complete access to DoorLoop's data
  license:
    name: Terms and Conditions
    url: https://www.doorloop.com/legal/terms
  contact:
    name: DoorLoop Inc.
    url: www.doorloop.com
    email: support@doorloop.com
  termsOfService: https://www.doorloop.com/legal/terms
servers:
- url: https://app.doorloop.com/api
  description: Production
tags:
- name: Accounts
paths:
  /accounts:
    parameters: []
    get:
      summary: List all Accounts
      tags:
      - Accounts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: number
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/account'
              examples: {}
            application/xml:
              schema:
                type: object
                properties: {}
            multipart/form-data:
              schema:
                type: object
                properties: {}
        '400':
          description: Bad Request
      operationId: get-accounts
      description: Retrieves the chart of accounts
      parameters:
      - schema:
          type: string
          enum:
          - ASSET_ACCOUNTS_RECEIVABLE
          - ASSET_OTHER_CURRENT_ASSETS
          - ASSET_BANK
          - ASSET_FIXED_ASSETS
          - ASSET_OTHER_ASSETS
          - LIABILITY_ACCOUNTS_PAYABLE
          - LIABILITY_CREDIT_CARD
          - LIABILITY_OTHER_CURRENT_LIABILIY
          - LIABILITY_LONG_TERM_LIABILITY
          - EQUITY_EQUITY
          - REVENUE_INCOME
          - REVENUE_OTHER_INCOME
          - EXPENSE_EXPENSE
          - EXPENSE_OTHER_EXPENSE
          - EXPENSE_COGS
        in: query
        name: filter_type
        description: Filter by account type
      - schema:
          type: string
          enum:
          - ACCOUNTS_RECEIVABLE
          - ACCOUNTS_PAYABLE
          - UNAPPLIED_LEASE_PAYMENTS_INCOME
          - UNDEPOSITED_FUNDS
          - LATE_FEES
          - MANAGEMENT_FEES
          - RENTAL_INCOME
          - SECURITY_DEPOSIT
          - APPLICATION_FEE
          - OPERATING_ACCOUNT
          - TRUST_ACCOUNT
          - OWNER_CONTRIBUTION
          - OWNER_DISTRIBUTION
          - OPENING_BALANCE
          - CONVENIENCE_FEE
          - CLEARING_ACCOUNT
          - EQUITY_RETAINED_EARNINGS
        in: query
        name: filter_DefaultAccountFor
        description: Returns the account this company has designated for a given purpose. The chart of accounts is per-company, so account ids differ between companies - resolve these once per company and cache the ids rather than matching on account names.
      - schema:
          type: boolean
        in: query
        name: filter_leaseChargeItem
        description: Return only lease charge items - the catalog of things a tenant can be charged for
      - schema:
          type: string
        in: query
        name: filter_parentAccount
        description: Return only the direct children of this account
      - schema:
          type: string
        in: query
        name: filter_ancestorAccount
        description: Return every account beneath this one at any depth. Use this to resolve a charge to its top-level category when a company files charges under sub-accounts - sub-accounts do not carry a filter_DefaultAccountFor value, only the top-level anchor does.
      - $ref: '#/components/parameters/page_number'
      - $ref: '#/components/parameters/page_size'
      security:
      - Key: []
    post:
      summary: Create an Account
      operationId: post-account
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/account'
        '400':
          description: Bad Request
        '404':
          description: Not Found
      tags:
      - Accounts
      description: Creates an Account
      security:
      - Key: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/account'
  /accounts/{accountId}:
    parameters:
    - schema:
        type: string
        example: 00000020f51bb4362eee2a4d
      name: accountId
      in: path
      required: true
      description: The account Id
    get:
      summary: Retrieve an Account
      tags:
      - Accounts
      responses:
        '200':
          description: Accounts Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: number
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/account'
              examples: {}
            application/xml:
              schema:
                type: object
                properties: {}
            multipart/form-data:
              schema:
                type: object
                properties: {}
        '400':
          description: Bad Request
        '404':
          description: Not Found
      operationId: get-account
      description: Retreives an account from the Chart of Accounts
      parameters: []
      security:
      - Key: []
    put:
      summary: Update an Account
      operationId: put-account
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/account'
        '400':
          description: Bad Request
        '404':
          description: Not Found
      tags:
      - Accounts
      description: Updates an Account
      security:
      - Key: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/account'
    delete:
      summary: Delete an Account
      operationId: delete-account
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/account'
        '400':
          description: Bad Request
        '404':
          description: Not Found
      description: Deletes an Account
      security:
      - Key: []
      tags:
      - Accounts
components:
  schemas:
    account:
      title: Account
      x-stoplight:
        id: ivofyr6xu6xk4
      type: object
      examples:
      - id: string
        name: string
        active: true
        type: ASSET_ACCOUNTS_RECEIVABLE
        description: string
      description: Represents an account from the Chart of Accounts
      properties:
        id:
          $ref: '#/components/schemas/mongoId'
        name:
          type: string
          maxLength: 1000
        active:
          type: boolean
        type:
          type: string
          enum:
          - ASSET_ACCOUNTS_RECEIVABLE
          - ASSET_OTHER_CURRENT_ASSETS
          - ASSET_BANK
          - ASSET_FIXED_ASSETS
          - ASSET_OTHER_ASSETS
          - LIABILITY_ACCOUNTS_PAYABLE
          - LIABILITY_CREDIT_CARD
          - LIABILITY_OTHER_CURRENT_LIABILIY
          - LIABILITY_LONG_TERM_LIABILITY
          - EQUITY_EQUITY
          - REVENUE_INCOME
          - REVENUE_OTHER_INCOME
          - EXPENSE_EXPENSE
          - EXPENSE_OTHER_EXPENSE
          - EXPENSE_COGS
        description:
          type: string
      required:
      - name
      - active
      - type
    mongoId:
      type: string
      title: mongoId
      x-stoplight:
        id: 40j7qlmpihfdj
      pattern: /^[a-f\d]{24}$/i
      examples:
      - 507f191e810c19729de860ea
      example: 00000020f51bb4362eee2a4d
  parameters:
    page_number:
      name: page_number
      in: query
      required: false
      description: 1-based page index. Pages are disjoint. Every list response includes a total.
      schema:
        type: integer
        minimum: 1
        default: 1
    page_size:
      name: page_size
      in: query
      required: false
      description: Rows per page. Defaults to 50. Values above 1000 are rejected with a 400.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 50
  securitySchemes:
    Key:
      type: apiKey
      in: header
      name: Authorization
      description: 'Bearer token. Create a key under Settings -> API access; it is a JWT. Example: `Authorization: Bearer eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.<payload>.<signature>`'
